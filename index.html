<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>IdeoSorter</title>
    <link rel="shortcut icon" href="./icon.png" type="image/x-icon">
    <link href="./icon.png" type="image/x-icon">
    <meta property="og:title" content="IdeoSorter">
    <meta property="og:image" content="https://quark88.github.io/ideosorter/icon.png">
    <meta property="og:url" content="https://quark88.github.io/ideosorter">
    <meta property="og:type" content="Political test">
    <meta property="og:locale" content="en_US">
    <meta property="og:description"
        content="IdeoSorter finds your political ideology with a minimal amount of time, using highly specific questions.">
    <link rel="stylesheet" href="./style.css">
</head>

<body>

    <div id="border">
        <main>
            <div id="quiz">
                <div id="question">Loading...</div>
                <div id="options">
                    <div id="a" class="optionborder">
                        <div class="option">Loading...</div>
                    </div>
                    <div id="b" class="optionborder">
                        <div class="option">Loading...</div>
                    </div>
                    <div id="c" class="optionborder">
                        <div class="option">Loading...</div>
                    </div>
                    <div id="d" class="optionborder">
                        <div class="option">Loading...</div>
                    </div>
                </div>
                <div id="back" class="optionborder">
                    <div class="back">Back</div>
                </div>
            </div>
            <div id="results" style="display: none;">
                <div id="yourideologyis">Your ideology is...</div>
                <div id="match">Loading...</div>
                <div id="flagborder">
                    <img id="flag" src="./flags/Loading.svg">
                </div>
                <div id="quote">Loading...</div>
            </div>
        </main>
    </div>

</body>

<script src="./script.js"></script>

</html>
